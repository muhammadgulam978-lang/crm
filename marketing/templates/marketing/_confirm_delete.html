{% extends 'leads/base.html' %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="list-header">
  <h2 class="page-title">Delete "{{ obj_name }}"?</h2>
</div>
{% include 'marketing/_nav.html' with nav='' %}

<div class="form-card" style="max-width:600px">
  <div class="form-card-body" style="padding:20px 28px">
    <p>This action cannot be undone. Confirm?</p>
    <form method="post">{% csrf_token %}
      <div class="form-actions" style="display:flex;gap:10px">
        <a href="{% url cancel_url %}" class="btn" style="background:#64748b">Cancel</a>
        <button class="btn" type="submit" style="background:#dc2626">Yes, delete</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
