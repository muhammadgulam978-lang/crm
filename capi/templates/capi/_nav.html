<style>
.capi-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.capi-nav a{padding:7px 14px;border-radius:20px;background:#fff;border:1px solid var(--border,#ddd);font-size:13px;color:inherit;text-decoration:none}
.capi-nav a.on{background:var(--brand-grad,#4f46e5);color:#fff;border-color:transparent}
.capi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.capi-mono{font-family:monospace;font-size:12px;word-break:break-all}
.capi-muted{color:var(--text-muted,#888);font-size:12.5px}
.capi-pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;font-size:12px;max-height:320px}
.capi-inline{display:inline}
</style>
<div class="capi-nav">
  <a href="{% url 'marketing:content_list' %}">Drafts</a>
  <a href="{% url 'capi:dashboard' %}" class="{% if nav == 'dashboard' %}on{% endif %}">Dashboard</a>
  <a href="{% url 'capi:connections' %}" class="{% if nav == 'connections' %}on{% endif %}">Connections</a>
  <a href="{% url 'capi:meta_event_list' %}" class="{% if nav == 'leadads' %}on{% endif %}">Lead Ads</a>
  <a href="{% url 'capi:config_list' %}" class="{% if nav == 'mapping' %}on{% endif %}">Event mapping</a>
  <a href="{% url 'capi:event_list' %}?tab=queue" class="{% if nav == 'queue' %}on{% endif %}">Queue</a>
  <a href="{% url 'capi:event_list' %}?tab=sent" class="{% if nav == 'sent' %}on{% endif %}">Sent</a>
  <a href="{% url 'capi:event_list' %}?tab=failed" class="{% if nav == 'failed' %}on{% endif %}">Failed</a>
  <a href="{% url 'capi:event_list' %}?tab=retry" class="{% if nav == 'retry' %}on{% endif %}">Retry</a>
  <a href="{% url 'capi:log_list' %}" class="{% if nav == 'logs' %}on{% endif %}">Logs</a>
</div>
